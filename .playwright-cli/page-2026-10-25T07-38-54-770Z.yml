        - generic [ref=f6e75]:
          - heading "Velada — Sacred Mushroom Vigil" [level=3] [ref=f6e79]
          - paragraph [ref=f6e80]: A guided nocturnal ceremony rooted in traditional Mazatecan practice. Consecrated sacred mushroom, blended with ceremonial cacao, is consumed within a protected space accompanied by sacred songs, grounding smudges, and compassionate facilitation throughout the night.
        - generic [ref=f6e81]:
          - heading "Ayahuasca Ceremony" [level=3] [ref=f6e86]
          - paragraph [ref=f6e87]: A deep ceremonial journey with the sacred vine of the Amazon. Facilitated with reverence for indigenous tradition, each session is held in a small, intentional container with experienced guides providing unwavering support throughout the night.
        - generic [ref=f6e88]:
          - heading "Night Gatherings" [level=3] [ref=f6e92]
          - paragraph [ref=f6e93]: Community-oriented ceremonial evenings blending breathwork, sacred plant teas, sound immersion, and guided meditation. Ideal for seekers exploring plant spirit healing for the first time in a gentle, supported setting.
        - generic [ref=f6e94]:
          - heading "Private Ceremonies" [level=3] [ref=f6e98]
          - paragraph [ref=f6e99]: Personalized one-on-one or small-group sessions designed around your specific healing intentions. Conducted with full facilitator presence, these private containers offer depth, intimacy, and focused ceremonial support.
