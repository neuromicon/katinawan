        - generic [ref=f18e71]: Our Ceremonies
        - heading "Sacred Healing Experiences" [level=2] [ref=f18e72]
        - paragraph [ref=f18e73]: Each ceremony is a distinct path — held within a consecrated, protected space where trained facilitators accompany you with music, grounding presence, and compassionate support.
      - generic [ref=f18e74]:
        - generic [ref=f18e75]:
          - heading "Velada — Sacred Mushroom Vigil" [level=3] [ref=f18e79]
          - paragraph [ref=f18e80]: A guided nocturnal ceremony rooted in traditional Mazatecan practice. Consecrated sacred mushroom, blended with ceremonial cacao, is consumed within a protected space accompanied by sacred songs, grounding smudges, and compassionate facilitation throughout the night.
        - generic [ref=f18e81]:
          - heading "Ayahuasca Ceremony" [level=3] [ref=f18e86]
          - paragraph [ref=f18e87]: A deep ceremonial journey with the sacred vine of the Amazon. Facilitated with reverence for indigenous tradition, each session is held in a small, intentional container with experienced guides providing unwavering support throughout the night.
        - generic [ref=f18e88]:
          - heading "Night Gatherings" [level=3] [ref=f18e92]
          - paragraph [ref=f18e93]: Community-oriented ceremonial evenings blending breathwork, sacred plant teas, sound immersion, and guided meditation. Ideal for seekers exploring plant spirit healing for the first time in a gentle, supported setting.
        - generic [ref=f18e94]:
          - heading "Private Ceremonies" [level=3] [ref=f18e98]
          - paragraph [ref=f18e99]: Personalized one-on-one or small-group sessions designed around your specific healing intentions. Conducted with full facilitator presence, these private containers offer depth, intimacy, and focused ceremonial support.
      - generic [ref=f18e100]:
        - heading "The Shamanic Thread of Katin-awan" [level=3] [ref=f18e105]
        - paragraph [ref=f18e106]:
          - text: In pre-colonial Philippines, spiritual harmony and healing were guided by
          - emphasis [ref=f18e107]: Babaylan
          - text: and
          - emphasis [ref=f18e108]: Katalonan
          - text: — guardians of herbal wisdom who communicated with nature spirits (
          - emphasis [ref=f18e109]: diwata
          - text: ) and ancestor spirits (
          - emphasis [ref=f18e110]: anito
          - text: ).
        - paragraph [ref=f18e111]:
          - text: In Visayas, when seekers seek profound answers, they ask for
          - strong [ref=f18e112]: katin-awan
          - text: — the lifting of cloudiness from the soul. We honor this sacred lineage by cultivating humility, deep respect for plant spirits, and communion with nature.
