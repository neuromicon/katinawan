name: Vercel Production Deployment

# This workflow triggers when pushing to main and deploys using Vercel CLI.
# Note: If you have already connected your GitHub repository in the Vercel Dashboard,
# Vercel automatically deploys every push out-of-the-box without requiring this action.
# This workflow is provided for teams using GitHub Actions for gated deployments.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: false # Set to true once VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets are configured in GitHub repo secrets
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
